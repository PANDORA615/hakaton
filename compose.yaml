services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retention
      POSTGRES_USER: retention
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retention -d retention"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://retention:${POSTGRES_PASSWORD}@db:5432/retention
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      ANALYSIS_AS_OF: ${ANALYSIS_AS_OF-2026-10-19T15:00:00Z}
      RETENTION_RUN_LIMIT: ${RETENTION_RUN_LIMIT:-200}
      RETENTION_SNAPSHOT_LIMIT: ${RETENTION_SNAPSHOT_LIMIT:-100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      OIDC_ALLOWED_SUB: ${OIDC_ALLOWED_SUB:-}
      OIDC_SESSION_SECRET: ${OIDC_SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
