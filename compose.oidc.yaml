services:
  frontend:
    ports: !override []
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    command: [dex, serve, /etc/dex/config.yaml]
    env_file: .runtime/oidc.env
    environment:
      DEX_EXPAND_ENV: "false"
    volumes:
      - ./infra/dex.yaml:/etc/dex/config.yaml:ro
      - dexdata:/var/dex
    restart: unless-stopped
  caddy:
    image: caddy:2.11.7-alpine
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - frontend
      - dex
    restart: unless-stopped
volumes:
  dexdata:
  caddydata:
  caddyconfig:
